name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Story-coverage gate. Works out of the box — needs only Node, no install.
  # Keep this job; it enforces STORIES.md coverage (see CLAUDE.md).
  stories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Story coverage
        run: node scripts/check-stories.mjs

  # FILL IN: the rest of your gate. Mirror the /ship sequence and the Commands
  # table in CLAUDE.md. Example for a Node project (uncomment + adjust):
  #
  # verify:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
